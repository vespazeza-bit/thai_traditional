<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>จอแสดงคิว · เรือนสมุนไพร นวดแผนไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', sans-serif;
    background: #1a3d2b;
    color: #fff;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 32px;
    background: rgba(0,0,0,.28);
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .logo { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    width: 52px; height: 52px;
    border-radius: 13px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
    flex-shrink: 0;
  }
  .logo-icon img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .logo-name  { font-size: 20px; font-weight: 700; letter-spacing: .01em; }
  .logo-sub   { font-size: 12px; opacity: .65; margin-top: 2px; }
  .clock { text-align: right; }
  .clock-time {
    font-size: 42px; font-weight: 700; letter-spacing: .04em;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .clock-sec { font-size: 22px; opacity: .6; }
  .clock-date { font-size: 12px; opacity: .65; margin-top: 3px; }

  /* ── Main area ── */
  .main {
    display: flex; flex: 1; overflow: hidden;
  }

  /* ── Current queue panel (left) ── */
  .current {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 48px;
    position: relative;
  }
  .current::after {
    content: ''; position: absolute;
    right: 0; top: 8%; bottom: 8%; width: 1px;
    background: rgba(255,255,255,.12);
  }

  .calling-badge {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: .18em;
    text-transform: uppercase; opacity: .75; margin-bottom: 18px;
  }
  .calling-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #74c69d;
    animation: blink 1.5s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: .3; transform: scale(.7); }
  }

  .queue-number {
    font-size: clamp(100px, 16vw, 180px);
    font-weight: 900; line-height: 1; color: #fff;
    letter-spacing: .02em; font-variant-numeric: tabular-nums;
    text-shadow: 0 4px 40px rgba(0,0,0,.5);
    animation: fadeIn .4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }

  .patient-name {
    font-size: clamp(22px, 3.5vw, 38px);
    font-weight: 700; margin-top: 10px; text-align: center;
    max-width: 560px;
  }
  .info-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 100px; padding: 8px 22px;
    font-size: 17px; font-weight: 600; margin-top: 14px;
  }
  .svc-label {
    font-size: 15px; opacity: .8; margin-top: 8px; text-align: center;
  }
  .ther-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 14px; font-size: 15px; opacity: .8;
  }
  .ther-av {
    width: 34px; height: 34px; border-radius: 17px;
    background: rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
  }

  .empty-state {
    text-align: center; opacity: .45;
  }
  .empty-icon { font-size: 64px; margin-bottom: 16px; }
  .empty-text { font-size: 20px; font-weight: 600; }
  .empty-sub  { font-size: 14px; margin-top: 6px; }

  /* ── Recent panel (right) ── */
  .recent {
    width: 340px; flex-shrink: 0;
    padding: 20px 18px;
    background: rgba(0,0,0,.22);
    overflow-y: auto; display: flex; flex-direction: column;
  }
  .recent-title {
    font-size: 11px; font-weight: 700; letter-spacing: .16em;
    opacity: .55; margin-bottom: 14px; text-transform: uppercase;
  }
  .recent-list { display: flex; flex-direction: column; gap: 2px; }
  .recent-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 10px;
    border-radius: 10px;
    transition: background .2s;
  }
  .recent-item.latest {
    background: rgba(180, 130, 40, 0.28);
    border: 1px solid rgba(180, 130, 40, 0.45);
  }
  .recent-item.latest .recent-no {
    color: #c9a45e;
  }
  .recent-no {
    font-size: 22px; font-weight: 900;
    color: #95d5b2; min-width: 56px; letter-spacing: .01em;
    font-family: 'IBM Plex Mono', monospace;
  }
  .recent-info { flex: 1; min-width: 0; }
  .recent-info .r-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent-info .r-sub  { font-size: 11px; opacity: .55; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .latest-tag {
    flex-shrink: 0;
    background: #52b788; color: #fff;
    font-size: 10px; font-weight: 700; padding: 2px 8px;
    border-radius: 100px; letter-spacing: .05em;
  }

  /* ── Ticker ── */
  .ticker {
    flex-shrink: 0; height: 42px;
    background: rgba(0,0,0,.32);
    display: flex; align-items: center; overflow: hidden;
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .ticker-inner {
    display: flex; white-space: nowrap;
    animation: marquee 50s linear infinite;
  }
  @keyframes marquee {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .ticker-seg {
    padding: 0 56px; font-size: 13px;
    color: rgba(255,255,255,.7); letter-spacing: .02em;
  }
  .ticker-dot { color: #74c69d; }

  /* Scrollbar hidden */
  .recent::-webkit-scrollbar { display: none; }
  .recent { scrollbar-width: none; }
</style>
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────── -->
<div class="header">
  <div class="logo">
    <div class="logo-icon">
      <img src="thaimed scheduler.png" alt="ThaiMed Scheduler" />
    </div>
    <div>
      <div class="logo-name">ThaiMed Scheduler</div>
      <div class="logo-sub">ระบบจัดการคิวนัดหมายบริการแพทย์แผนไทย</div>
    </div>
  </div>
  <div class="clock">
    <div class="clock-time">
      <span id="clock-hm">--:--</span><span class="clock-sec" id="clock-s">:--</span>
    </div>
    <div class="clock-date" id="clock-date">—</div>
  </div>
</div>

<!-- ── Main ───────────────────────────────────────────────── -->
<div class="main">
  <div class="current" id="current-panel">
    <div class="empty-state">
      <div class="empty-icon">🌿</div>
      <div class="empty-text">ยังไม่มีการเรียกคิว</div>
      <div class="empty-sub">กรุณานั่งรอบริเวณโซนพักคอย</div>
    </div>
  </div>

  <div class="recent">
    <div class="recent-title">เรียกล่าสุด</div>
    <div class="recent-list" id="recent-list">
      <div style="text-align:center;opacity:.35;font-size:13px;padding:28px 0">ยังไม่มีประวัติการเรียก</div>
    </div>
  </div>
</div>

<!-- ── Ticker ─────────────────────────────────────────────── -->
<div class="ticker">
  <div class="ticker-inner" id="ticker-inner"></div>
</div>

<script>
// ── Ticker setup ──────────────────────────────────────────
const TICKER_SEGS = [
  "ยินดีต้อนรับสู่เรือนสมุนไพร นวดแผนไทย",
  "กรุณานั่งรอบริเวณโซนพักคอย เจ้าหน้าที่จะเรียกตามลำดับคิว",
  "โปรดเก็บบัตรคิวของท่านไว้จนกว่าจะได้รับบริการ",
  "ขอบคุณที่ไว้วางใจใช้บริการแพทย์แผนไทย",
];

(function setupTicker() {
  const inner = document.getElementById('ticker-inner');
  const txt = TICKER_SEGS.map((s, i) =>
    `<span class="ticker-seg">${s}</span><span class="ticker-dot">✦</span>`
  ).join('');
  inner.innerHTML = txt + txt; // doubled for seamless loop
})();

// ── Clock ─────────────────────────────────────────────────
const DAYS_TH   = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const MONTHS_TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function updateClock() {
  const n = new Date();
  const h = String(n.getHours()).padStart(2,'0');
  const m = String(n.getMinutes()).padStart(2,'0');
  const s = String(n.getSeconds()).padStart(2,'0');
  document.getElementById('clock-hm').textContent = `${h}:${m}`;
  document.getElementById('clock-s').textContent  = `:${s}`;
  document.getElementById('clock-date').textContent =
    `วัน${DAYS_TH[n.getDay()]} ${n.getDate()} ${MONTHS_TH[n.getMonth()]} ${n.getFullYear()+543} · เปิดบริการ 10:00–21:00`;
}
updateClock();
setInterval(updateClock, 1000);

// ── Helpers ───────────────────────────────────────────────
function fmtNo(n) { return `A${String(n || 0).padStart(2,'0')}`; }

// PDPA: แสดงเฉพาะชื่อ ซ่อนนามสกุลด้วย XXX
function maskName(name) {
  if (!name) return '—';
  const parts = name.trim().split(/\s+/);
  if (parts.length <= 1) return name;
  return parts.slice(0, -1).join(' ') + ' XXX';
}

// ── Render current ────────────────────────────────────────
function renderCurrent(q) {
  const panel = document.getElementById('current-panel');
  if (!q) {
    panel.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🌿</div>
        <div class="empty-text">ยังไม่มีการเรียกคิว</div>
        <div class="empty-sub">กรุณานั่งรอบริเวณโซนพักคอย</div>
      </div>`;
    return;
  }
  const qNo   = fmtNo(q.queueNo);
  const name  = maskName(q.customer || (q.hn ? `HN ${q.hn}` : null));
  const bed   = q.bedLabel ? `<div class="info-chip">🛏 ${q.bedLabel}</div>` : '';

  panel.innerHTML = `
    <div class="calling-badge">
      <div class="calling-dot"></div>
      กำลังเรียกคิว
    </div>
    <div class="queue-number">${qNo}</div>
    <div class="patient-name">${name}</div>
    ${bed}
  `;
}

// ── Render recent ─────────────────────────────────────────
function renderRecent(history) {
  const list = document.getElementById('recent-list');
  if (!history || history.length === 0) {
    list.innerHTML = '<div style="text-align:center;opacity:.35;font-size:13px;padding:28px 0">ยังไม่มีประวัติการเรียก</div>';
    return;
  }
  list.innerHTML = history.map((q, i) => {
    const qNo  = fmtNo(q.queueNo);
    const name = maskName(q.customer || (q.hn ? `HN ${q.hn}` : null));
    const sub  = q.bedLabel || '—';
    return `
      <div class="recent-item${i === 0 ? ' latest' : ''}">
        <div class="recent-no">${qNo}</div>
        <div class="recent-info">
          <div class="r-name">${name}</div>
          <div class="r-sub">${sub}</div>
        </div>
        ${i === 0 ? '<span class="latest-tag">ล่าสุด</span>' : ''}
      </div>`;
  }).join('');
}

// ── Load data ─────────────────────────────────────────────
let lastTs = 0;
function loadData() {
  try {
    const raw = localStorage.getItem('thai_queue_display');
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.ts === lastTs) return;
    lastTs = data.ts;
    renderCurrent(data.current || null);
    renderRecent(data.history || []);
  } catch {}
}

loadData();
window.addEventListener('storage', e => { if (e.key === 'thai_queue_display') loadData(); });
setInterval(loadData, 1500);
</script>
</body>
</html>
